name: Nightly Sandbox Verification
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nightly-sandbox:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentshelf
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: agentshelf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentshelf -d agentshelf_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://agentshelf:ci-test-only@localhost:5432/agentshelf_test
      TEST_DATABASE_URL: postgresql+psycopg://agentshelf:ci-test-only@localhost:5432/agentshelf_test
      PAYPAL_MODE: sandbox
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run python seed.py
      - name: Run search benchmark and Phase B readiness check
        run: |
          uv run python evaluate_search.py
          uv run python verify_phase_b.py gate-status
      - name: Run live PayPal Sandbox & AI evaluations when secrets are configured
        if: env.PAYPAL_CLIENT_ID != '' && env.ANTHROPIC_API_KEY != ''
        run: |
          uv run python verify_phase_b.py preflight
          uv run python evaluate_listings.py
          uv run python evaluate_buyers.py
