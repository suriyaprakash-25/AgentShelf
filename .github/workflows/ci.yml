name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentshelf
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: agentshelf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentshelf -d agentshelf_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://agentshelf:ci-test-only@localhost:5432/agentshelf_test
      TEST_DATABASE_URL: postgresql+psycopg://agentshelf:ci-test-only@localhost:5432/agentshelf_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - name: Install matching backup clients
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump" >> "$GITHUB_ENV"
          echo "PG_RESTORE=/usr/lib/postgresql/17/bin/pg_restore" >> "$GITHUB_ENV"
      - run: uv run pytest -q
      - run: uv run pip-audit
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --audit-level=high
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentshelf
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: agentshelf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentshelf -d agentshelf"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://agentshelf:ci-test-only@127.0.0.1:5432/agentshelf
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run python seed.py
        working-directory: backend
      - run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/agentshelf-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 1
          done
          echo 'API readiness failed'
          exit 1
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: frontend/test-results/
          retention-days: 7
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan complete commit history
        run: docker run --rm --mount type=bind,source="$GITHUB_WORKSPACE",target=/repo,readonly zricethezav/gitleaks:v8.30.1 git /repo --redact
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag agentshelf:ci .
      - name: Verify packaged API and worker
        env:
          AGENTSHELF_VERIFY_IMAGE: agentshelf:ci
        run: |
          docker compose -p agentshelf-ci-smoke -f compose.verify.yaml up -d --wait db
          docker compose -p agentshelf-ci-smoke -f compose.verify.yaml run --rm api alembic upgrade head
          docker compose -p agentshelf-ci-smoke -f compose.verify.yaml run --rm api alembic check
          docker compose -p agentshelf-ci-smoke -f compose.verify.yaml run --rm api python seed.py
          docker compose -p agentshelf-ci-smoke -f compose.verify.yaml up -d api worker
          python scripts/verify-container.py
          docker compose -p agentshelf-ci-smoke -f compose.verify.yaml exec -T worker python -c "from app.db import session_factory; from app.models import WorkerHeartbeat, utcnow; from sqlalchemy import select; db=session_factory(); row=db.scalar(select(WorkerHeartbeat)); assert row and (utcnow()-row.seen_at).total_seconds()<30; db.close()"
      - name: Remove isolated verification resources
        if: always()
        run: docker compose -p agentshelf-ci-smoke -f compose.verify.yaml down --volumes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-smoke
          path: work/container-smoke.json
          retention-days: 7
