[project]
name = "agentshelf-backend"
version = "0.1.0"
description = "Seller-first agentic commerce with human-approved PayPal checkout"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "httpx>=0.28,<1", "mcp[cli]>=2.3,<3",
  "anthropic>=0.70,<1", "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires isolated PostgreSQL", "sandbox: requires real PayPal credentials"]
