services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentshelf
      POSTGRES_USER: agentshelf
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentshelf -d agentshelf"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
