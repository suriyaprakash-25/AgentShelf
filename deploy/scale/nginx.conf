# Round-robin load balancer in front of N stateless web replicas.
# Docker's DNS returns one A record per replica of the `web` service; `resolve` and the
# shared zone keep the upstream list current when replicas scale up or down.
worker_processes auto;
events { worker_connections 4096; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream agentshelf_web {
        zone agentshelf_web 64k;
        least_conn;
        server web:8000 resolve max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    log_format upstream '$remote_addr "$request_method" $status upstream=$upstream_addr '
                        'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout upstream;
    client_max_body_size 6m;

    server {
        listen 8080;

        location / {
            proxy_pass http://agentshelf_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Keep host:port intact: MCP validates Host against DNS-rebinding attacks.
            proxy_set_header Host $http_host;
            # Append the TCP peer; the app trusts only this rightmost hop (TRUSTED_PROXY_HOPS=1).
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 75s;
            # Retry idempotent requests on another replica if one is down or restarting.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            # Server-sent events (Playground chat) must stream, not buffer.
            proxy_buffering off;
        }
    }
}
